# Control config for this repository's Pages mirror.
#
# It lives in the repository now so CI can deploy the mirror the way the local
# deploy script did: `wrangler pages deploy` run from this directory takes the
# project name, its bindings and its vars from here, and `pages_build_output_dir`
# names the upload that tools/deploy-pages.mjs stages.
#
# No [triggers] here, and that is not an omission: Pages has no cron triggers, so
# the Friday 22:00 UTC refresh lives in .github/workflows/refresh-data.yml.

name = "rbiweeklydashboard"
pages_build_output_dir = "../.pages-dist"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# The KV namespace data-sync's merge cache lives in — the only copy, now that
# this deployment is the site's only home.
[[kv_namespaces]]
binding = "SYNC_KV"
id = "722040ed409f423ca8d6ed9c8ca81153"

[vars]
GH_REPO = "parth-soni-10/RBI-Weekly-Data-Dashboard"
GH_BRANCH = "main"
REFRESH_WEEK_LIMIT = "8"
RSS_SITE_URL = "https://rbiweeklydashboard.pages.dev/"
