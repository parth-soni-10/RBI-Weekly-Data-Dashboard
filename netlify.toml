[build]
  publish = "public"
  functions = "netlify/functions"
  # Regenerate the static data files on every deploy so the site always ships
  # with the latest RBI weekly reports, auto-update the forward-book series
  # with the newest official RBI disclosures: the Bulletin's monthly Table 4A
  # (update-fwd-monthly.js) + the Mar/Sep half-yearly FX report anchors
  # (update-fwd-series.js), re-pull the World Bank external-debt ranking
  # (biggest-borrower tiles + chart), and append today's rows to the daily
  # history files (sentiment + FII/DII flows). See scripts/fetch-all.js +
  # scripts/update-fwd-*.js + scripts/fetch-debt-rankings.js +
  # scripts/snapshot-*.js.
  command = "npm run fetch:data && npm run update:fwd && npm run update:fwd-monthly && npm run fetch:debt && npm run snapshot:fng && npm run snapshot:fii"

[functions]
  node_bundler = "esbuild"

# Security headers for every page + asset. The site is fully static with
# same-origin scripts/styles/fonts only; functions live under /.netlify/*.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# Long-cache the vendored libraries (they change only with a deploy).
#
# Deliberately NOT `immutable`: these filenames carry no hash or version segment
# (chart.umd.js, gsap.min.js, three.min.js), and `immutable` promises the bytes
# at a URL can never change. The day one of them is bumped, every returning
# visitor would keep the old copy for a year with no way to revoke it — the
# promise the header makes is the thing that makes it unrecoverable. A week plus
# stale-while-revalidate still keeps repeat visits off the network.
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# The self-hosted fonts. Same week-plus-stale policy as /vendor/* and for the
# same reason: the filenames carry no content hash, so `immutable` would be a
# promise that the bytes at this URL can never change — and the day a font is
# replaced, every returning visitor would pin the old one for a year.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[functions.fetch-crude]
  timeout = 26

[functions.fetch-data]
  timeout = 26

# Long-running data scrapers + on-demand scrapers that walk several upstream
# weeks/pages sequentially — the default 10s would cut them mid-flight.
[functions.data-latest]
  timeout = 26

[functions.data-forex-weekly]
  timeout = 26

[functions.fetch-external-debt]
  timeout = 26

[functions.fetch-fwd-latest]
  timeout = 20

[functions.fetch-fii]
  timeout = 20

[functions.fetch-fii-history]
  timeout = 26

[functions.fetch-fx-intervention]
  timeout = 20

[functions.fetch-em-peers]
  timeout = 20

[functions.fetch-gsec]
  timeout = 20

[functions.fetch-tax]
  timeout = 20

[functions.fetch-reer]
  timeout = 20

[functions.fetch-sentiment]
  timeout = 20
