[build]
  publish = "public"
  functions = "netlify/functions"
  # Regenerate the static data files on every deploy so the site always ships
  # with the latest RBI weekly reports, auto-update the forward-book series
  # with the newest official RBI disclosures: the Bulletin's monthly Table 4A
  # (update-fwd-monthly.js) + the Mar/Sep half-yearly FX report anchors
  # (update-fwd-series.js), and re-pull the World Bank external-debt ranking
  # (biggest-borrower tiles + chart). See scripts/fetch-all.js +
  # scripts/update-fwd-*.js + scripts/fetch-debt-rankings.js.
  command = "npm run fetch:data && npm run update:fwd && npm run update:fwd-monthly && npm run fetch:debt && npm run snapshot:fng"

[functions]
  node_bundler = "esbuild"

# Security headers for every page + asset. The site is fully static with
# same-origin scripts/styles/fonts only; functions live under /.netlify/*.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# Long-cache the vendored libraries + icons (they change only with a deploy).
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[functions.fetch-crude]
  timeout = 26

[functions.fetch-data]
  timeout = 26

# Long-running data scrapers
[functions.fetch-fii]
  timeout = 20

[functions.fetch-fii-history]
  timeout = 26

[functions.fetch-fx-intervention]
  timeout = 20

[functions.fetch-em-peers]
  timeout = 20

[functions.fetch-gsec]
  timeout = 20

[functions.fetch-tax]
  timeout = 20

[functions.fetch-reer]
  timeout = 20

[functions.fetch-sentiment]
  timeout = 20
