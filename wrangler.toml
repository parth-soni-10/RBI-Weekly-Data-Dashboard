# The one config this site has: its Cloudflare Pages project.
#
#   npx wrangler pages dev public      → local test on http://localhost:8788
#   npx wrangler pages deploy          → publish .pages-dist to the project
#
# There is no Worker config and no Worker. What answers `/data/*.json` is a
# Pages Function: `functions/[[path]].js` catches every request and hands it to
# `functions/_router.js`, which routes it to the module under netlify/functions/
# that answers it and caches the response at the colo. Pages compiles those files
# as part of the deploy, so nothing is bundled here, there is no `_worker.js` to
# stage, and `wrangler deploy` is not a command this repository has any use for.
#
# The build only stages: `pages_build_output_dir` names the upload that
# tools/deploy-pages.mjs writes from `public/`, and it regenerates no data — the
# committed `public/*.json` is what a deploy ships, which is why the weekly
# refresh is .github/workflows/refresh-data.yml and not a build step.

name = "rbiweeklydashboard"
pages_build_output_dir = ".pages-dist"
compatibility_date = "2026-10-01"

# fetch-data.js parses the RBI weekly press release with node-xlsx, and every
# scraper uses Buffer/AbortController. Pages compiles functions/ with this flag,
# so those builtins are left as `node:` externals in the deployment.
compatibility_flags = ["nodejs_compat"]

# The KV namespace data-sync's merge cache lives in — the only copy.
[[kv_namespaces]]
binding = "SYNC_KV"
id = "722040ed409f423ca8d6ed9c8ca81153"

[vars]
# Non-secret coordinates: the repository the refresh workflow commits into, how
# far back the forward-book walker may look, and the site's own address for the
# RSS feed's channel link.
GH_REPO = "parth-soni-10/RBI-Weekly-Data-Dashboard"
GH_BRANCH = "main"
REFRESH_WEEK_LIMIT = "8"
RSS_SITE_URL = "https://rbiweeklydashboard.pages.dev/"
