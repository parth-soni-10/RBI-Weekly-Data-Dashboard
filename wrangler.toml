# Cloudflare Workers config for the RBI weekly dashboard.
#
# The site is the `public/` directory — the same publish directory Netlify used —
# and the sixteen functions under netlify/functions/ are bundled into worker.js
# rather than copied. See worker.js for what it wires up: the /data/* public API
# the dashboard calls, the /.netlify/functions/* paths, the environment, and the
# KV store behind data-sync. netlify/functions/refresh-data.js is bundled the same
# way but is NOT a function: it has no route, only the cron trigger below.
#
#   npx wrangler dev --test-scheduled   → local test, plus /__scheduled to fire
#                                         the weekly refresh by hand
#   npx wrangler deploy                 → publish to <name>.<your-subdomain>.workers.dev
#
# `run_worker_first` is scoped to the two API prefixes only, so page and asset
# requests are served straight from the assets layer and never invoke the Worker.

name = "rbi-weekly-dashboard"
main = "worker.js"
compatibility_date = "2026-10-01"

# Served from the workers.dev hostname; versioned Preview URLs are off. They
# would serve this same Worker — data-sync's write endpoint included — from a
# second hostname nobody asked for.
workers_dev = true
preview_urls = false

# fetch-data.js parses the RBI weekly press release with node-xlsx, and every
# scraper uses Buffer/AbortController; nodejs_compat supplies them.
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/.netlify/functions/*", "/data/*"]

# data-sync's durable merge cache. It was a Netlify Blob; the blob API the
# function used (get / setJSON) is now served from this namespace, so the
# dashboard's Reload button still persists merged weeks across visitors and
# deploys. The key is `records`, under the store name it always used
# (`rbi-data-sync/records`), so nothing about the payload changed.
[[kv_namespaces]]
binding = "SYNC_KV"
id = "722040ed409f423ca8d6ed9c8ca81153"

# The weekly data refresh. Netlify ran the refresh scripts (scripts/fetch-all.js
# and friends) as part of every deploy, so a deploy shipped freshly scraped data;
# Cloudflare has no build step, so a deploy ships the committed public/*.json
# instead. This cron is what keeps those files current again: `scheduled` in
# worker.js runs the plan in netlify/functions/refresh-data.js — it reads each
# file through the GitHub API, regenerates it from the live sources, and commits
# the changed ones in a single commit, which Workers Builds then deploys.
#
# Friday 22:00 UTC (03:30 IST Saturday) — hours after that day's RBI Weekly
# Statistical Supplement is published and after NSDL posts the day's FPI flows,
# so one run covers the whole week. A run that finds nothing new commits nothing
# (scrape timestamps do not count as change), so a quiet Friday costs nothing.
[triggers]
crons = ["0 22 * * 5"]

[vars]
# The repository the refresh reads and commits through (owner/repo).
GH_REPO = "parth-soni-10/RBI-Weekly-Data-Dashboard"
GH_BRANCH = "main"
# Weeks one invocation may fetch. The refresh is incremental, so a normal Friday
# fetches 0–1; the cap bounds the cold or badly lagged case, because a cron
# invocation is bounded (30s wall clock on the Free plan, 15 minutes on Paid) and
# being cut off mid-scrape commits nothing. The remainder drains on the next run.
REFRESH_WEEK_LIMIT = "8"
# Base URL for the links public/feed.xml carries. The same value as the default in
# scripts/make-rss.js, stated here so a deployed feed's links are a config fact.
RSS_SITE_URL = "https://rbiweeklydashboard.pages.dev/"

# GH_TOKEN is the refresh's only credential — a fine-grained personal access token
# with `Contents: read and write` on the repo above. It is a secret, so it is set
# out of band and never written into this file:
#
#   npx wrangler secret put GH_TOKEN
#
# With it unset the cron logs one line and does nothing at all — no baseline to
# read and nowhere to commit, so it does not scrape either.
