# Bundle input for this site's Pages build — NOT a deployment.
#
# The Cloudflare Pages project runs, as its build command:
#
#   npx --yes wrangler@4 deploy --dry-run --outdir .pages-bundle
#   && node tools/deploy-pages.mjs --assets public --bundle .pages-bundle --out .pages-dist
#
# and this file is read for the first half of that only: `--dry-run` bundles
# `main` below into the worker.js that tools/deploy-pages.mjs stages as the
# project's `_worker.js`. Nothing is deployed from here, and nothing should be —
# this site has one host, the Pages project. A `wrangler deploy` run in this
# directory would publish a second copy of the same code to a workers.dev
# hostname nobody links to, which is precisely what the host consolidation
# removed.
#
# Everything the deployed site needs lives where the deploy reads it:
# `pages/wrangler.toml` carries the project name, its SYNC_KV binding and its
# vars (GH_REPO, GH_BRANCH, REFRESH_WEEK_LIMIT, RSS_SITE_URL), `public/_headers`
# carries the response headers, and the weekly refresh is a GitHub Actions
# workflow (.github/workflows/refresh-data.yml) because Pages has no cron
# triggers.
#
# Not published: this directory is not the staged upload at all — the build
# hands tools/deploy-pages.mjs `public/` — so nothing here can reach the site.

name = "rbi-weekly-dashboard"
main = "worker.js"
compatibility_date = "2026-10-01"

# fetch-data.js parses the RBI weekly press release with node-xlsx, and every
# scraper uses Buffer/AbortController; nodejs_compat supplies them. The flag is
# kept here as well as in pages/wrangler.toml on purpose: it is what tells
# wrangler to leave a node builtin as a `node:` external while bundling, so the
# force is what the deployed runtime expects. The runtime's own flags are the
# Pages project's (it runs the bundle); this file only produces it.
compatibility_flags = ["nodejs_compat"]
