name: Refresh data

# The weekly data refresh — the schedule that used to be a Cloudflare cron
# trigger.
#
# It ran on the Worker (`[triggers]` in wrangler.toml → worker.js `scheduled` →
# netlify/functions/refresh-data.js over the GitHub API) for one reason: a
# Cloudflare deploy has no build step, so a deploy ships the committed data
# files and something else had to keep them current. This site is served from
# Cloudflare Pages now, which has no cron triggers either, so the schedule lives
# here.
#
# Running here also makes the job simpler than the cron was. A runner has this
# repository checked out, so the plan runs over the working tree
# (scripts/refresh-static.js, the entry point `npm run refresh` uses) rather than
# reading and committing every file through the GitHub API — and the commit is
# an ordinary `git commit`, so no personal access token is involved. Same plan,
# same bytes, whichever way it is started.
#
# Friday 22:00 UTC (03:30 IST Saturday) — hours after that day's RBI Weekly
# Statistical Supplement is published and after NSDL posts the day's FPI flows,
# so one run covers the whole week. A run that finds nothing new commits nothing
# (scrape timestamps do not count as change), so a quiet Friday costs nothing.
#
# The data commit this pushes is also what deploys the site: the Pages project
# is connected to this repository, so the push rebuilds and republishes it.

on:
  schedule:
    # 22:00 UTC every Friday.
    - cron: "0 22 * * 5"
  workflow_dispatch: {} # manual "Run workflow" button in the Actions tab

permissions:
  contents: write

# Serialize runs (a manual run while another is going is the way the push step
# loses — a rejected non-fast-forward).
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Give the scraper clearance to hit RBI + Yahoo over the public internet.
    # GitHub's hosted runners have default egress; no restricted-network pool.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Syntax-check every function/script, and run the regression tests. Both
      # run before any data is fetched: a cache whose write path is broken must
      # not be republished, and the tests are the only thing that pins the
      # validation that keeps a record's "date" from executing.
      - name: Syntax check
        run: npm run check

      - name: Test
        run: npm test

      # The whole plan in one command: rbi-data.json + feed.xml, the forward-book
      # series (half-yearly anchor then Bulletin Table 4A, in that order), the
      # World Bank external-debt ranking, and the sentiment + FII/DII histories
      # — the same steps, run by the same builders, that the cron ran.
      #
      # Steps fail open, one at a time: a dead source costs its own file and
      # nothing else. So the exit status is carried to the end of the job rather
      # than aborting here — whatever did change still ships — and the run is
      # still reported red.
      - name: Refresh the data (the plan in scripts/refresh-static.js)
        id: refresh
        run: |
          set +e
          node scripts/refresh-static.js
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            echo "::warning::a refresh step failed (see the log above) — the files that did change are still committed below"
          fi

      # Deliberately NOT one of the plan's steps: it walks the WSS archive with
      # deliberate delays, it is a one-shot backfill of the reserves
      # decomposition (FCA / SDR / IMF / gold tonnes) into the historical weeks,
      # it drains one batch per run, and a backlog may need the button pressed
      # again. RBI's doc CDN fronts an F5 limiter that intermittently serves a
      # challenge page instead of the file — the script detects it by magic
      # bytes, paces itself, aborts after three consecutive challenges, and
      # persists after every filled week. Exit code stays 0 either way, so a hot
      # limiter just means the backlog resumes on a later run.
      - name: Backfill reserves decomposition fields (FCA/SDR/IMF)
        run: node scripts/backfill-decomp.js

      - name: Commit updated data (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -u, not -A: every TRACKED file this run modified, which is exactly
          # the plan's output — public/*.json, public/feed.xml and
          # netlify/functions/fetch-fx-intervention.js. A file the run created
          # that the repository does not track is not this job's to add.
          git add -u
          if git diff --cached --quiet; then
            echo "No new data — nothing to commit."
          else
            git commit -m "chore(data): weekly refresh"
            # A manual push can land on main while this run is scraping, which
            # would reject the push as non-fast-forward. Rebase our single data
            # commit onto origin/main first; retry once on a fresh race.
            git pull --rebase origin main && git push || \
              { sleep 20; git pull --rebase origin main && git push; }
            echo "Pushed refreshed data."
          fi

      - name: Fail the run if a refresh step did
        if: steps.refresh.outputs.status != '0'
        run: |
          echo "::error::the refresh reported a failed step (exit ${{ steps.refresh.outputs.status }})"
          exit 1
