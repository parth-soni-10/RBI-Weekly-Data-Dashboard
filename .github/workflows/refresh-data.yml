name: Refresh RBI data (manual)

# MANUAL ONLY — the weekly run happens in the Worker now.
#
# The refresh lives in the Cloudflare Worker's cron trigger: wrangler.toml
# [triggers] → worker.js `scheduled` → netlify/functions/refresh-data.js, which
# reads each committed data file through the GitHub API, regenerates it from the
# live sources, and commits the changed ones (Friday 22:00 UTC). That is the
# replacement for the Netlify build command this workflow was written to mirror:
# a Workers deploy has no build step, so a deploy ships the committed files and
# something else has to keep them current.
#
# Two systems refreshing the same files on the same Friday would only race each
# other's commits and deploy twice, so this workflow keeps its steps and loses its
# schedule. What it is for now:
#
#   - the fallback, when the Worker's cron cannot run — a missing or expired
#     GH_TOKEN secret, a Cloudflare-side outage, or a branch experiment;
#   - backfill-decomp.js, which walks the WSS archive with deliberate delays and
#     is deliberately NOT part of the Worker's bounded invocation.
#
# Its steps are the same builders `npm run refresh` (scripts/refresh-static.js)
# calls, so a manual run and a cron run cannot produce different data. Note that
# backfill-decomp.js drains one batch per run, so a backlog may need the button
# pressed again.

on:
  workflow_dispatch: {} # manual "Run workflow" button in the Actions tab

permissions:
  contents: write

# Serialize runs (a manual run while another is going is the way the push step
# loses — a rejected non-fast-forward).
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Give the scraper clearance to hit RBI + Yahoo over the public internet.
    # GitHub's hosted runners have default egress; no restricted-network pool.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Syntax-check every function/script, and run the data-sync regression
      # tests. Both run before any data is fetched: a cache whose write path is
      # broken must not be republished, and the tests are the only thing that
      # pins the validation that keeps a record's "date" from executing.
      - name: Syntax check
        run: npm run check

      - name: Test
        run: npm test

      - name: Fetch latest RBI weekly data
        run: npm run fetch:data

      - name: Update forward-book series (half-yearly report + Bulletin monthly table)
        run: npm run update:fwd && npm run update:fwd-monthly

      - name: Refresh World Bank external-debt ranking (biggest-borrower tiles)
        run: npm run fetch:debt

      # Snapshot today's composite Fear & Greed score into the committed
      # sentiment-history.json (one row per run — a Friday point now that this
      # runs weekly — updated in place, 400-point window). Feeds the sentiment
      # trend chart; fails open — a blocked Yahoo never breaks the run.
      - name: Snapshot daily sentiment score
        run: npm run snapshot:fng

      # One-shot backfill of the reserves decomposition (FCA / SDR / IMF /
      # gold tonnes) into the historical weeks. The WSS scraper parsed these
      # fields but dropped them from records until now (and, before that,
      # swapped the INR/USD columns); the composition chart needs them per
      # week. RBI's doc CDN fronts an F5 limiter that intermittently serves
      # a challenge page instead of the file — the script detects it by magic
      # bytes, paces itself, aborts after three consecutive challenges, and
      # persists after every filled week. Exit code stays 0 either way, so a
      # hot limiter just means the backlog resumes on a later run.
      - name: Backfill reserves decomposition fields (FCA/SDR/IMF)
        run: node scripts/backfill-decomp.js

      - name: Commit updated data (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # feed.xml too: `npm run fetch:data` rewrites it from the records it
          # just fetched, and leaving it out only produced a dirty tree.
          git add public/rbi-data.json public/external-debt.json public/sentiment-history.json public/feed.xml netlify/functions/fetch-fx-intervention.js
          if git diff --cached --quiet; then
            echo "No new data — nothing to commit."
          else
            git commit -m "chore(data): refresh rbi-data.json and forward-book series"
            # A manual push can land on main while this run is scraping, which
            # would reject the push as non-fast-forward. Rebase our single data
            # commit onto origin/main first; retry once on a fresh race.
            git pull --rebase origin main && git push || \
              { sleep 20; git pull --rebase origin main && git push; }
            echo "Pushed refreshed data."
          fi