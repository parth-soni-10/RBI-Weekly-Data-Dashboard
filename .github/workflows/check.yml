name: Check

on:
  push:
  pull_request:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # The refresh workflow that already exists regenerates committed data on
      # a schedule. It looks at the data, not the code, so nothing else checks a
      # change to a scraper before it ships.
      - name: Install dependencies
        run: npm ci

      - name: Syntax-check every script
        run: npm run check

      - name: Run the unit tests
        run: npm test
