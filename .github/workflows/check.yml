name: Check

on:
  push:
  pull_request:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # The two workflows that already exist refresh committed data on a cron.
      # Neither one looks at the code, so until now nothing checked a change to
      # a scraper before it shipped.
      - name: Install dependencies
        run: npm ci

      - name: Syntax-check every script
        run: npm run check

      - name: Run the unit tests
        run: npm test
